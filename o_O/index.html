  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  #scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;

    cursor: grab;
    touch-action: none;

    gap: 16px;
    padding: 0 16px;

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 36px;
    height: 72px;
    padding: 0 48px;
    border-radius: 48px;
    background: var(--orange);
    color: #f5f4ef;

  .cta:hover, .cta:focus-visible { filter: brightness(1.08); }
  /* Same size as the CTA, white outline instead of the fill */
  .cta-ghost { background: transparent; box-shadow: inset 0 0 0 1px #f5f4ef; transition: background-color 0.2s; }
  .cta-ghost:hover, .cta-ghost:focus-visible { filter: none; background: rgba(245, 244, 239, 0.08); }
  .arrow { width: 10px; height: 10px; flex: none; }
  /* With JS the CTA becomes glossy orange glass: a hairline rim lit at two
     corners, light that turns towards the cursor, a 3D tilt and a light
     magnetic pull. The fill stays solid: over the empty dark page a see-through
     glass only muddies the colour. .is-glass is added by the script; without
     JS the plain orange button stays. */
  @media screen {
    .cta.is-glass {
      position: relative;
      isolation: isolate;           /* the rim sits under the label */
      --pink: 236, 72, 255;
      --gold: 255, 214, 74;
      background: var(--orange);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.35),
        inset 0 -8px 18px rgba(120, 30, 10, 0.25);
      text-shadow: 0 1px 6px rgba(120, 30, 10, 0.3);
      will-change: transform;
    }
    .cta.is-glass::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: inherit;
      pointer-events: none;
    }
    /* The rim: a hairline that burns pink at one corner and gold at the
       opposite one, fading to faint glass in between. --ga turns it. */
    .cta.is-glass::after {
      padding: 1px;
      opacity: 0.48;
      filter: blur(0.4px);
      background: conic-gradient(from var(--ga, 45deg),
        rgb(var(--pink)) 0deg, rgba(var(--pink), 0.35) 40deg,
        rgba(255, 255, 255, 0.1) 80deg, rgba(255, 255, 255, 0.1) 140deg,
        rgba(var(--gold), 0.35) 150deg, rgb(var(--gold)) 180deg, rgba(var(--gold), 0.35) 220deg,
        rgba(255, 255, 255, 0.1) 260deg, rgba(255, 255, 255, 0.1) 320deg,
        rgba(var(--pink), 0.35) 330deg, rgb(var(--pink)) 360deg);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
    }
    .cta.is-glass:hover, .cta.is-glass:focus-visible { filter: none; }
  }
  @media (max-width: 760px) {
    .cta { height: 60px; padding: 0 32px; gap: 24px; }

<script>
  // Glass CTA: a slow drifting float, and a light magnetic lean and 3D tilt
  // towards a nearby cursor. The glass itself never changes shape: only
  // position and a tilt in perspective.
  // Works with a mouse and with a finger; the hover effects need a mouse.
  (function () {
    const glass = document.querySelector(".cta-main");
    const still = matchMedia("(prefers-reduced-motion: reduce)");
    const BASE = 0;
    const MAGNET = 275;         // cursor distance at which the glass starts to lean
    let pos = { x: 0, y: 0 }, vel = { x: 0, y: 0 }, lean = { x: 0, y: 0 }, leanTo = { x: 0, y: 0 };
    let rx = 0, rxVel = 0, ry = 0, ryVel = 0, hoverTilt = { x: 0, y: 0 }, sway = 1;
    const REST_GLOW = Math.PI / 4;   // pink corner top-right, gold bottom-left
    let glow = REST_GLOW, glowTo = REST_GLOW;
    let raf = 0, last = 0, t0 = performance.now();

    // Damped spring step: stiffness from the angular frequency w, damping ratio z
    function spring(x, v, target, w, z, dt) {
      const a = -w * w * (x - target) - 2 * z * w * v;
      v += a * dt;
      return [x + v * dt, v];
    }

    function frame(now) {
      const dt = Math.min((now - (last || now)) / 1000, 1 / 30) || 1 / 60;
      last = now;
      const t = (now - t0) / 1000;
      const calm = still.matches;
      // The magnetic lean eases in rather than jumping with every mouse event
      const ease = 1 - Math.exp(-dt * 2.2);
      lean.x += (leanTo.x - lean.x) * ease;
      lean.y += (leanTo.y - lean.y) * ease;

      const z = calm ? 1 : 0.75;
      [pos.x, vel.x] = spring(pos.x, vel.x, lean.x, 7, z, dt);
      [pos.y, vel.y] = spring(pos.y, vel.y, lean.y, 7, z, dt);

      // 3D tilt: towards the cursor at rest, into the motion while moving.
      // A critically damped spring, so it settles without wobbling.
      const clamp = (v) => Math.max(-12, Math.min(12, v));
      const ryTo = clamp(hoverTilt.y + vel.x * 0.006);
      const rxTo = clamp(hoverTilt.x - vel.y * 0.006);
      [ry, ryVel] = spring(ry, ryVel, ryTo, 6, 1, dt);
      [rx, rxVel] = spring(rx, rxVel, rxTo, 6, 1, dt);
      const speed = Math.hypot(vel.x, vel.y);

      // The drift fades out while held and back in once the glass has settled
      const settled = speed < 40 && Math.hypot(pos.x - lean.x, pos.y - lean.y) < 6;
      sway += ((settled && !calm ? 1 : 0) - sway) * (1 - Math.exp(-dt * (settled ? 0.9 : 6)));
      const fx = Math.sin(t * 0.36 + 0.5) * 1.6 * sway;
      const fy = (Math.sin(t * 0.8) * 2.6 + Math.sin(t * 0.47 + 1.3) * 1.4) * sway;
      const fr = (Math.sin(t * 0.6 + 1) * 0.45 + Math.sin(t * 0.29) * 0.25) * sway;

      glass.style.transform =
        `perspective(900px) translate(${pos.x + fx}px, ${pos.y + fy}px) ` +
        `rotate(${BASE + fr}deg) rotateX(${rx}deg) rotateY(${ry}deg)`;

      // Turn the lit corners towards the cursor (or, at rest, back to top-right),
      // the short way round
      const turn = Math.atan2(Math.sin(glowTo - glow), Math.cos(glowTo - glow));
      glow += turn * (1 - Math.exp(-dt * 2));
      glass.style.setProperty("--ga", `${glow * 180 / Math.PI}deg`);
      raf = requestAnimationFrame(frame);
    }

    // Magnetic hover: a nearby cursor pulls the resting glass a few pixels towards it
    function hover(e) {
      if (e.pointerType !== "mouse" || still.matches) return;
      const r = glass.getBoundingClientRect();
      const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
      const d = Math.hypot(dx, dy) - r.width / 2;
      const pull = d < MAGNET ? (1 - Math.max(d, 0) / MAGNET) * 0.042 : 0;
      // CSS angle: 0 points up, clockwise. The pill is wide, so squash the
      // horizontal distance a little or the light would hug the short ends.
      glowTo = d < MAGNET * 2 ? Math.atan2(dx * 0.45, -dy) : REST_GLOW;
      leanTo = { x: Math.max(-8.3, Math.min(8.3, dx * pull)), y: Math.max(-5.5, Math.min(5.5, dy * pull)) };
      // Turn the face towards the cursor, as if the glass were looking at it
      const near = d < MAGNET ? 1 - Math.max(d, 0) / MAGNET : 0;
      hoverTilt = {
        x: -Math.max(-1, Math.min(1, dy / r.height)) * 8 * near,
        y: Math.max(-1, Math.min(1, dx / (r.width / 2))) * 8 * near,
      };
    }

    function setup() {
      glass.classList.add("is-glass");
      raf = requestAnimationFrame(frame);
    }
    addEventListener("pointermove", hover, { passive: true });
    document.addEventListener("pointerleave", () => { leanTo = { x: 0, y: 0 }; hoverTilt = { x: 0, y: 0 }; glowTo = REST_GLOW; });
    setup();
  })();
</script>

<script type="module">
import * as THREE from "three";
import { mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";

const canvas = document.getElementById("scene");
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
} catch (e) {
  document.documentElement.classList.add("no-webgl");
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);

// Studio environment: near-black room, a hard blue floor glow and a set of
// thin white strips — chrome reads as foil only with high-contrast reflections
function buildEnvironment() {
  const env = new THREE.Scene();
  const dome = new THREE.Mesh(
    new THREE.SphereGeometry(20, 64, 32),
    new THREE.ShaderMaterial({
      side: THREE.BackSide,
      vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
      fragmentShader: `varying vec3 vDir; void main(){
        float h = vDir.y;
        vec3 top = vec3(0.01, 0.01, 0.012);
        vec3 mid = vec3(0.06, 0.062, 0.07);
        vec3 bot = vec3(0.14, 0.14, 0.15);
        vec3 c = h > 0. ? mix(mid, top, smoothstep(0., .5, h)) : mix(mid, bot, smoothstep(0.05, .55, -h));
        gl_FragColor = vec4(c, 1.);
      }`,
    })
  );
  env.add(dome);
  const strip = (w, h, x, y, z, intensity) => {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(1, 1, 1).multiplyScalar(intensity), side: THREE.DoubleSide })
    );
    m.position.set(x, y, z);
    m.lookAt(0, 0, 0);
    env.add(m);
  };
  strip(14, 6, 0, 9, 9, 2.2);     // broad soft key, above-front
  strip(12, 2.2, -4, 9, 5, 5);    // key, top-left
  strip(1.2, 10, 9, 1, 5, 4);     // tall rim, right
  strip(0.6, 10, -9, 0, 6, 2.5);  // thin left strip
  strip(8, 0.5, 0, 4, 11, 3);     // front top line
  strip(3, 3, 6, 6, -8, 2);       // back-right
  strip(2.5, 1.6, 5, 3, 9, 4);    // small window, front-right
  strip(1.6, 2.4, -6, -2, 8, 3);  // small window, low-left
  strip(10, 0.35, 0, -3, 9, 2.5); // low horizontal line
  const pmrem = new THREE.PMREMGenerator(renderer);
  return pmrem.fromScene(env, 0).texture;
}
scene.environment = buildEnvironment();

const chrome = new THREE.MeshPhysicalMaterial({
  color: 0xd9dade,
  metalness: 1,
  roughness: 0.05,
  envMapIntensity: 1.15,
});

// --- Foil balloon glyphs ---------------------------------------------------
// A glyph is rasterised, turned into a signed distance field, and inflated:
// height grows like a circle profile from the outline inwards, so the edge is
// a welded seam and the faces are puffy. Pleats ripple near the seam.

const INF = 1e20;
function edt1d(f, n, d, v, z) {
  let k = 0;
  v[0] = 0; z[0] = -INF; z[1] = INF;
  for (let q = 1; q < n; q++) {
    let s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
    while (s <= z[k]) {
      k--;
      s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
    }
    k++; v[k] = q; z[k] = s; z[k + 1] = INF;
  }
  k = 0;
  for (let q = 0; q < n; q++) {
    while (z[k + 1] < q) k++;
    d[q] = (q - v[k]) * (q - v[k]) + f[v[k]];
  }
}
// Squared Euclidean distance transform (Felzenszwalb & Huttenlocher)
function edt(grid, w, h) {
  const n = Math.max(w, h);
  const f = new Float64Array(n), d = new Float64Array(n);
  const v = new Int32Array(n), z = new Float64Array(n + 1);
  for (let x = 0; x < w; x++) {
    for (let y = 0; y < h; y++) f[y] = grid[y * w + x];
    edt1d(f, h, d, v, z);
    for (let y = 0; y < h; y++) grid[y * w + x] = d[y];
  }
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) f[x] = grid[y * w + x];
    edt1d(f, w, d, v, z);
    for (let x = 0; x < w; x++) grid[y * w + x] = d[x];
  }
  return grid;
}

function shapeSDF(w, h, draw, blurPx) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.filter = `blur(${blurPx}px)`;  // rounds the corners like an inflated outline
  ctx.fillStyle = ctx.strokeStyle = "#fff";
  draw(ctx, w / 2, h / 2);
  const alpha = ctx.getImageData(0, 0, w, h).data;
  const toIn = new Float64Array(w * h), toOut = new Float64Array(w * h);
  for (let i = 0; i < w * h; i++) {
    const inside = alpha[i * 4 + 3] > 127;
    toIn[i] = inside ? 0 : INF;
    toOut[i] = inside ? INF : 0;
  }
  edt(toIn, w, h); edt(toOut, w, h);
  const sd = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) {
    sd[i] = toOut[i] > 0 ? Math.sqrt(toOut[i]) - 0.5 : -(Math.sqrt(toIn[i]) - 0.5);
  }
  return { sd, w, h };
}

const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

function balloonShape({ sd, w, h }, { scale, step = 2, seed = 0 }) {
  const at = (x, y) => {
    x = Math.max(0, Math.min(w - 1.001, x)); y = Math.max(0, Math.min(h - 1.001, y));
    const x0 = x | 0, y0 = y | 0, fx = x - x0, fy = y - y0;
    const i = y0 * w + x0;
    return (sd[i] * (1 - fx) + sd[i + 1] * fx) * (1 - fy) + (sd[i + w] * (1 - fx) + sd[i + w + 1] * fx) * fy;
  };
  let maxD = 0;
  for (let i = 0; i < sd.length; i++) maxD = Math.max(maxD, sd[i]);
  const D = maxD * 0.92;            // half stroke width, px
  const puff = 0.95;                // thickness relative to stroke width
  const pleatK = (Math.PI * 2) / (D * 1.1);

  const nx = Math.ceil(w / step), ny = Math.ceil(h / step);
  const cols = nx + 1;
  const sdv = new Float32Array(cols * (ny + 1));
  for (let j = 0; j <= ny; j++) for (let i = 0; i <= nx; i++) sdv[j * cols + i] = at(i * step, j * step);
  const used = new Uint8Array(cols * (ny + 1));
  const cells = [];
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const a = j * cols + i, b = a + 1, d = a + cols, c = d + 1;
    if (sdv[a] > 0 || sdv[b] > 0 || sdv[c] > 0 || sdv[d] > 0) {
      cells.push(a, b, c, d);
      used[a] = used[b] = used[c] = used[d] = 1;
    }
  }

  const front = new Map();
  const verts = [];
  const cx = w / 2, cy = h / 2;
  const px2 = new Float32Array(used.length * 2), sv = new Float32Array(used.length);
  const hv = new Float32Array(used.length), along = new Float32Array(used.length);
  for (let k = 0; k < used.length; k++) {
    if (!used[k]) continue;
    let x = (k % cols) * step, y = ((k / cols) | 0) * step;
    let s = sdv[k];
    let gx = at(x + 1, y) - at(x - 1, y), gy = at(x, y + 1) - at(x, y - 1);
    const gl = Math.hypot(gx, gy) || 1; gx /= gl; gy /= gl;
    if (s < 0) { x -= gx * s; y -= gy * s; s = 0; }  // snap onto the outline
    const t = s / D;
    px2[k * 2] = x; px2[k * 2 + 1] = y; sv[k] = s;
    hv[k] = Math.sqrt(Math.max(0, 1 - Math.pow(1 - Math.min(t, 1), 2)));
    along[k] = (x * -gy + y * gx) * pleatK;
  }
  // Relax the height field so the ridge along the stroke's middle becomes a
  // soft inflated dome instead of a bevel; the seam stays pinned at zero
  const tmp = new Float32Array(hv.length);
  for (let it = 0; it < 7; it++) {
    for (let k = 0; k < hv.length; k++) {
      if (!used[k] || sv[k] <= 0) { tmp[k] = hv[k]; continue; }
      let sum = 0, n = 0;
      for (const nb of [k - 1, k + 1, k - cols, k + cols]) {
        if (nb >= 0 && nb < hv.length && used[nb]) { sum += hv[nb]; n++; }
      }
      tmp[k] = n ? hv[k] * 0.3 + (sum / n) * 0.7 : hv[k];
    }
    hv.set(tmp);
  }
  for (let k = 0; k < used.length; k++) {
    if (!used[k]) continue;
    const t = sv[k] / D;
    // Sparse sharp creases: short stress lines running in from the seam,
    // each with its own length and depth, like real foil film
    const per = along[k] / (Math.PI * 2);
    const ci = Math.floor(per), local = per - ci;
    const r1 = hash(ci + seed * 97), r2 = hash(ci * 1.7 + seed * 31);
    let crease = 0;
    if (r1 > 0.5) {
      const len = 0.35 + r2 * 0.6;
      const across = Math.exp(-Math.pow((local - 0.5) / 0.1, 2));
      crease = across * (1 - smooth(len * 0.4, len, t)) * (0.5 + 0.5 * r1);
    }
    // A shallow groove just inside the outline reads as the welded seam
    const groove = Math.exp(-Math.pow(t / 0.09, 2)) * 0.18;
    const zz = D * puff * Math.sqrt(hv[k]) * (1 - 0.16 * crease - groove) * scale;
    const X = (px2[k * 2] - cx) * scale, Y = -(px2[k * 2 + 1] - cy) * scale;
    front.set(k, verts.length / 3);
    verts.push(X, Y, zz);
  }
  const frontCount = verts.length / 3;
  for (let i = 0; i < frontCount; i++) verts.push(verts[i * 3], verts[i * 3 + 1], -verts[i * 3 + 2]);

  const idx = [];
  for (let q = 0; q < cells.length; q += 4) {
    const a = front.get(cells[q]), b = front.get(cells[q + 1]), c = front.get(cells[q + 2]), d = front.get(cells[q + 3]);
    idx.push(a, d, b, b, d, c);
    idx.push(a + frontCount, b + frontCount, d + frontCount, b + frontCount, c + frontCount, d + frontCount);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
  geo.setIndex(idx);
  const merged = mergeVertices(geo, 1e-5);
  merged.computeVertexNormals();
  merged.computeBoundingBox();
  return merged;
}

const K = 1.3;
const U = 0.0071;                   // world units per logo unit
// Centre of each part's bounding box and its size, in logo units
const parts = {
  small: { at: [124.5, 225], size: [249, 249], grow: 30 },
  bar:   { at: [344.6, 413], size: [172.4, 36], grow: 26 },
  big:   { at: [593, 177.2], size: [349.6, 354.4], grow: 34 },
};
const PAD = 40;

const face = new THREE.Group();
scene.add(face);
const pivots = {};
Object.entries(parts).forEach(([name, p], i) => {
  const path = new Path2D(LOGO[name]);
  const w = Math.round((p.size[0] + PAD * 2) * K), h = Math.round((p.size[1] + PAD * 2) * K);
  const sdf = shapeSDF(w, h, (c, x, y) => {
    c.translate(x - p.at[0] * K, y - p.at[1] * K);
    c.scale(K, K);
    c.fill(path);
    // Thicken the eye rings: stroking the outline grows it evenly on both sides
    if (p.grow) { c.lineWidth = p.grow; c.lineJoin = "round"; c.stroke(path); }
  }, 5);
  const mesh = new THREE.Mesh(balloonShape(sdf, { scale: U / K, seed: i * 1.7 }), chrome);
  const pivot = new THREE.Group();
  pivot.add(mesh);
  pivot.position.set((p.at[0] - 384) * U, -(p.at[1] - 215.5) * U, 0);
  pivot.userData = { baseY: pivot.position.y, phase: i * 1.3 };
  face.add(pivot);
  pivots[name] = pivot;
});
const faceWidth = 768 * U;

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const tanHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const fitWidth = (faceWidth + 1.2) / (2 * tanHalf * camera.aspect);
  camera.position.set(0, 0.15, Math.max(8.6, fitWidth));
  camera.lookAt(0, -0.35, 0);
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
resize();

// Pointer: face looks at the cursor; drag spins it; click makes the big eye pop
const target = new THREE.Vector2();
let dragging = false, lastX = 0, spin = 0, spinVel = 0, surprise = 0;
canvas.addEventListener("pointermove", (e) => {
  target.x = (e.clientX / window.innerWidth) * 2 - 1;
  target.y = (e.clientY / window.innerHeight) * 2 - 1;
  if (dragging) {
    spinVel = (e.clientX - lastX) * 0.01;
    spin += spinVel;
    lastX = e.clientX;
  }
});
canvas.addEventListener("pointerdown", (e) => {
  dragging = true;
  lastX = e.clientX;
  canvas.setPointerCapture(e.pointerId);
  surprise = 1;
});
canvas.addEventListener("pointerup", () => { dragging = false; });

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const amp = reduceMotion ? 0 : 1;

const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if (!dragging) {
    spinVel *= 0.94;
    spin += spinVel;
    spin *= 0.97;
  }
  face.rotation.y += (target.x * 0.45 + spin - face.rotation.y) * 0.08;
  face.rotation.x += (target.y * 0.25 - face.rotation.x) * 0.08;

  surprise = Math.max(0, surprise - dt * 1.8);
  const pop = 1 + Math.sin(surprise * Math.PI) * 0.16;

  for (const p of face.children) {
    p.position.y = p.userData.baseY + Math.sin(t * 1.3 + p.userData.phase) * 0.05 * amp;
    p.rotation.y = Math.sin(t * 0.55 + p.userData.phase * 2) * 0.12 * amp;
  }
  pivots.big.scale.set(pop, pop, pop);
  pivots.small.rotation.z = Math.sin(t * 0.9) * 0.06 * amp;
  pivots.big.rotation.z = Math.sin(t * 0.7 + 1) * 0.05 * amp;
  pivots.bar.rotation.z = Math.sin(t * 1.1 + 2) * 0.05 * amp;

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
