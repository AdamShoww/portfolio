<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yeroshen.com</title>
<meta name="description" content="Скоро здесь будет портфолио">
<meta name="theme-color" content="#0d0d0f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='16' cy='34' r='9' fill='none' stroke='%23ffd23f' stroke-width='6'/%3E%3Ccircle cx='31' cy='48' r='4' fill='%23ffd23f'/%3E%3Ccircle cx='46' cy='30' r='14' fill='none' stroke='%23ffd23f' stroke-width='7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --fg: #f4f1ea;
    --muted: #8a877f;
    --accent: #ffd23f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Manrope", system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
  }
  #scene:active { cursor: grabbing; }
  .fallback {
    position: fixed;
    inset: 0;
    display: none;
    place-items: center;
    font-size: clamp(96px, 28vw, 320px);
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.04em;
  }
  .no-webgl .fallback { display: grid; }
  .caption {
    position: fixed;
    left: 0;
    right: 0;
    bottom: max(32px, env(safe-area-inset-bottom));
    padding: 0 16px;
    text-align: center;
    pointer-events: none;
  }
  .caption h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .caption p {
    margin-top: 6px;
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="Трёхмерный смайлик o.O"></canvas>
<div class="fallback" aria-hidden="true">o.O</div>
<div class="caption">
  <h1>yeroshen.com</h1>
  <p>Скоро здесь будет портфолио</p>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const canvas = document.getElementById("scene");
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
} catch (e) {
  document.documentElement.classList.add("no-webgl");
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d0f);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);

const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(3, 4, 5);
scene.add(key);

const material = new THREE.MeshPhysicalMaterial({
  color: 0xffb800,
  roughness: 0.18,
  metalness: 0,
  clearcoat: 1,
  clearcoatRoughness: 0.08,
});

// Face: small "o", dot ".", big "O"
const face = new THREE.Group();
scene.add(face);

const small = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.2, 48, 96), material);
small.position.set(-1.75, -0.15, 0);

const dot = new THREE.Mesh(new THREE.SphereGeometry(0.2, 48, 48), material);
dot.position.set(-0.55, -0.95, 0);

const big = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.3, 64, 128), material);
big.position.set(1.05, 0.25, 0);

const parts = [small, dot, big];
parts.forEach((m, i) => {
  const pivot = new THREE.Group();
  pivot.position.copy(m.position);
  m.position.set(0, 0, 0);
  pivot.add(m);
  pivot.userData = { base: pivot.position.clone(), phase: i * 1.3 };
  face.add(pivot);
});
const [smallPivot, dotPivot, bigPivot] = face.children;

// Soft contact shadow
const shadowTex = (() => {
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const g = c.getContext("2d");
  const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, "rgba(0,0,0,0.55)");
  grad.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = grad;
  g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
})();
const shadow = new THREE.Mesh(
  new THREE.PlaneGeometry(6, 1.6),
  new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
);
shadow.rotation.x = -Math.PI / 2;
shadow.position.y = -1.9;
scene.add(shadow);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // Keep the whole face (≈ 5 units wide) in view on narrow screens
  const fitWidth = 5.6 / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect);
  camera.position.set(0, 0.2, Math.max(8, fitWidth));
  camera.lookAt(0, -0.1, 0);
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
resize();

// Pointer: face looks at the cursor; drag spins it
const target = new THREE.Vector2();
let dragging = false, lastX = 0, spin = 0, spinVel = 0;
canvas.addEventListener("pointermove", (e) => {
  target.x = (e.clientX / window.innerWidth) * 2 - 1;
  target.y = (e.clientY / window.innerHeight) * 2 - 1;
  if (dragging) {
    spinVel = (e.clientX - lastX) * 0.01;
    spin += spinVel;
    lastX = e.clientX;
  }
});
canvas.addEventListener("pointerdown", (e) => {
  dragging = true;
  lastX = e.clientX;
  canvas.setPointerCapture(e.pointerId);
  surprise = 1;
});
canvas.addEventListener("pointerup", () => { dragging = false; });

// Blinks and "surprise" pop on click
let nextBlink = 1.5, blink = 0, surprise = 0;
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if (!dragging) {
    spinVel *= 0.94;
    spin += spinVel;
    spin *= 0.97;
  }
  face.rotation.y += (target.x * 0.5 + spin - face.rotation.y) * 0.08;
  face.rotation.x += (target.y * 0.3 - face.rotation.x) * 0.08;

  nextBlink -= dt;
  if (nextBlink <= 0) { blink = 1; nextBlink = 2 + Math.random() * 3; }
  blink = Math.max(0, blink - dt * 6);
  const lid = 1 - Math.sin(blink * Math.PI) * 0.85;

  surprise = Math.max(0, surprise - dt * 1.8);
  const pop = 1 + Math.sin(surprise * Math.PI) * 0.18;

  const amp = reduceMotion ? 0 : 1;
  face.children.forEach((p) => {
    const { base, phase } = p.userData;
    p.position.y = base.y + Math.sin(t * 1.4 + phase) * 0.06 * amp;
  });
  smallPivot.scale.set(1, lid, 1);
  bigPivot.scale.set(pop, lid * pop, pop);
  dotPivot.rotation.z = Math.sin(t * 2) * 0.2 * amp;
  smallPivot.rotation.z = Math.sin(t * 0.9) * 0.08 * amp;
  bigPivot.rotation.z = Math.sin(t * 0.7 + 1) * 0.06 * amp;

  shadow.scale.x = 1 + Math.sin(t * 1.4) * 0.03 * amp;
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
